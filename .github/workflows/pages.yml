# Build Scoop web as a static site and deploy to GitHub Pages.
name: Deploy Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build static export
        env:
          # Set these in repo Settings → Secrets and variables → Actions
          NEXT_PUBLIC_CHAIN: ${{ vars.NEXT_PUBLIC_CHAIN }}
          NEXT_PUBLIC_SCOOP_DIAMOND: ${{ vars.NEXT_PUBLIC_SCOOP_DIAMOND }}
          NEXT_PUBLIC_SCOOP_DEPLOY_BLOCK: ${{ vars.NEXT_PUBLIC_SCOOP_DEPLOY_BLOCK }}
          NEXT_PUBLIC_KEEPER_URL: ${{ vars.NEXT_PUBLIC_KEEPER_URL }}
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_BSC_RPC: ${{ vars.NEXT_PUBLIC_BSC_RPC }}
          # Project site: /repo-name ; user/org site or custom domain: leave empty
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
        run: |
          export NEXT_PUBLIC_CHAIN="${NEXT_PUBLIC_CHAIN:-mainnet}"
          pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
