# Build Scoop web as a static site and deploy to GitHub Pages (testnet defaults).
name: Deploy Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build static export
        env:
          # Repo Settings → Variables → Actions can override these.
          # Defaults: BSC testnet + Solana devnet (public addresses / RPCs only).
          NEXT_PUBLIC_CHAIN: ${{ vars.NEXT_PUBLIC_CHAIN }}
          NEXT_PUBLIC_SCOOP_DIAMOND: ${{ vars.NEXT_PUBLIC_SCOOP_DIAMOND }}
          NEXT_PUBLIC_SCOOP_DEPLOY_BLOCK: ${{ vars.NEXT_PUBLIC_SCOOP_DEPLOY_BLOCK }}
          NEXT_PUBLIC_KEEPER_URL: ${{ vars.NEXT_PUBLIC_KEEPER_URL }}
          NEXT_PUBLIC_WC_PROJECT_ID: ${{ vars.NEXT_PUBLIC_WC_PROJECT_ID }}
          NEXT_PUBLIC_BSC_RPC: ${{ vars.NEXT_PUBLIC_BSC_RPC }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_SOLANA_CLUSTER: ${{ vars.NEXT_PUBLIC_SOLANA_CLUSTER }}
          NEXT_PUBLIC_SOLANA_PROGRAM_ID: ${{ vars.NEXT_PUBLIC_SOLANA_PROGRAM_ID }}
          NEXT_PUBLIC_SOLANA_RPC: ${{ vars.NEXT_PUBLIC_SOLANA_RPC }}
        run: |
          # Project Pages URL: https://0xvoren.github.io/scoop/
          export NEXT_PUBLIC_BASE_PATH="${NEXT_PUBLIC_BASE_PATH:-/scoop}"
          export NEXT_PUBLIC_CHAIN="${NEXT_PUBLIC_CHAIN:-testnet}"
          export NEXT_PUBLIC_SCOOP_DIAMOND="${NEXT_PUBLIC_SCOOP_DIAMOND:-0xfB2678ff49967B073F6537781EC3d35DE731a5DF}"
          export NEXT_PUBLIC_SCOOP_DEPLOY_BLOCK="${NEXT_PUBLIC_SCOOP_DEPLOY_BLOCK:-143943857}"
          export NEXT_PUBLIC_BSC_RPC="${NEXT_PUBLIC_BSC_RPC:-https://bsc-testnet-rpc.publicnode.com}"
          export NEXT_PUBLIC_SOLANA_CLUSTER="${NEXT_PUBLIC_SOLANA_CLUSTER:-devnet}"
          export NEXT_PUBLIC_SOLANA_PROGRAM_ID="${NEXT_PUBLIC_SOLANA_PROGRAM_ID:-FC9im2jkXhYciLgvEMTgrmvmKMPFkehyM1g3EEnUrpHT}"
          export NEXT_PUBLIC_SOLANA_RPC="${NEXT_PUBLIC_SOLANA_RPC:-https://api.devnet.solana.com}"
          echo "Building for chain=${NEXT_PUBLIC_CHAIN} basePath=${NEXT_PUBLIC_BASE_PATH} solana=${NEXT_PUBLIC_SOLANA_CLUSTER}"
          pnpm build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
